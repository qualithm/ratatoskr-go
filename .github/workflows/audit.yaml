# Generated by dx/scripts/audit-sync from ci-templates/audit-go.yaml.
# Do not edit directly — change the template and re-run audit-sync.

name: Security Audit

# Advisory scans run daily; every job runs on Mondays and on a push that
# changes a dependency (qualithm/pm#3067).
on:
  schedule:
    - cron: "0 6 * * 0,2-6" # Daily at 06:00 UTC, except Monday
    - cron: "0 6 * * 1" # Monday at 06:00 UTC: every job
  push:
    branches: [development, main]
    paths:
      - "**/go.mod"
      - "**/go.sum"
      - ".github/workflows/audit.yaml"
  workflow_dispatch: {}

# A newer push supersedes an older one; schedules queue apart from pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  GOVULNCHECK_VERSION: v1.3.0

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          # Never true: setup-go's key omits the workflow name, so caching here would
          # claim CI's key on the default branch with a smaller build footprint. CI
          # would then hit it, restore too little, and skip saving the fuller cache.
          cache: false
      # Restore, never save, CI's module and build cache: govulncheck loads
      # every package. The paths must match setup-go's exactly for its cache to
      # match (qualithm/pm#3019).
      - name: Restore CI's Go cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: setup-go-${{ runner.os }}-x64-ubuntu24-go-1.27.3-
          restore-keys: setup-go-${{ runner.os }}-x64-ubuntu24-go-1.27.3-
      # govulncheck ships no binary: build it once per version and Go, then
      # restore it (qualithm/pm#3019).
      - name: Restore govulncheck
        id: govulncheck
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/go/bin/govulncheck
          key:
            govulncheck-${{ env.GOVULNCHECK_VERSION }}-go1.27.3-${{ runner.os }}-${{ runner.arch }}
      - name: Install govulncheck
        if: steps.govulncheck.outputs.cache-hit != 'true'
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: Run govulncheck
        id: scan
        continue-on-error: true
        run: govulncheck ./...
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: govulncheck found a vulnerability"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: govulncheck found a vulnerability"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1

  gosec:
    name: Security Scan (gosec)
    # Weekly: what it checks changes only with the code or dependencies.
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
          # See the govulncheck job: caching here would poison CI's setup-go key.
          cache: false
      - name: Run gosec
        id: scan
        continue-on-error: true
        uses: securego/gosec@9e6a9843d7a4a6e3e9a8539b02612c8a4aa3f889 # v2.27.1
        env:
          GOTOOLCHAIN: auto
        with:
          args: -exclude-dir=examples ./...
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: gosec flagged a finding"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: gosec flagged a finding"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
