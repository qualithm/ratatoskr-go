# Generated by dx/scripts/ci-sync from ci-templates/go-lib-gosec.yaml.
# Do not edit directly — change the template and re-run ci-sync.

name: CI

on:
  pull_request:
    branches: [main, test, development]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: "1.26.9"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.f.outputs.code == 'true' || steps.f.outputs.ci == 'true' }}
      is-main: ${{ steps.tier.outputs.is-main }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: f
        with:
          # A file must match every pattern. Under the default, any one match
          # is enough, so '**' alone marks every file as code and no exclusion
          # applies.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.github/**'
              - '!.githooks/**'
              - '!.vscode/**'
              - '!docker/**'
              - '!LICENSE'
            # The one file under .github/ that changes what these jobs run.
            ci:
              - '.github/workflows/ci.yaml'
      - id: tier
        run: |
          if [[ "${{ github.base_ref }}" == "main" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "is-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-main=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Format check
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: Tidy check
        run: |
          go mod tidy
          tidy_paths=(go.mod)
          [ -f go.sum ] && tidy_paths+=(go.sum)
          if ! git diff --exit-code "${tidy_paths[@]}"; then
            echo "go.mod / go.sum are not tidy. Run 'go mod tidy'."
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...

  lint:
    name: Lint
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.1
          install-mode: goinstall

  coverage:
    name: Coverage
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run:
          go test -race -count=1 -shuffle=on -coverprofile=coverage.out -covermode=atomic
          -coverpkg=./... ./...
      - name: Enforce coverage threshold
        run: |
          # Drop the examples package: it's a runnable sample, not library code.
          grep -v "/examples/" coverage.out > coverage.filtered.out
          pct=$(go tool cover -func=coverage.filtered.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Total coverage (excluding examples): ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 80.0) { print "coverage below 80%"; exit 1 } }'
      - name: Fetch Codecov CLI
        id: codecov-cli
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          # A pinned GitHub release instead of the action's runtime download
          # from cli.codecov.io, whose TLS handshake fails from our runners.
          # Bump both values together.
          CODECOV_CLI_VERSION: v11.3.1
          CODECOV_CLI_SHA256: ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/codecov" \
            "https://github.com/codecov/codecov-cli/releases/download/$CODECOV_CLI_VERSION/codecovcli_linux"
          echo "$CODECOV_CLI_SHA256  $RUNNER_TEMP/codecov" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/codecov"
      - name: Upload coverage to Codecov
        id: codecov
        if: ${{ !cancelled() && steps.codecov-cli.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: true
      - name: Wait before retrying the Codecov upload
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        run: sleep 30
      - name: Retry the Codecov upload
        id: codecov-retry
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: true
      # Non-blocking by design: Codecov reports coverage, it never gates it, so
      # a Codecov outage must not fail CI Required. A missed upload surfaces
      # as a warning annotation and a job summary line instead.
      - name: Report a failed Codecov upload
        if:
          ${{ !cancelled() && steps.codecov.outcome != 'success' && steps.codecov-retry.outcome !=
          'success' }}
        run: |
          echo "::warning title=Codecov upload failed::coverage was not uploaded to Codecov after a retry"
          echo "Codecov upload failed after a retry. See the upload steps in this job." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  benchmarks:
    name: Benchmark Check
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.is-main == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -run=^$ -bench=. -benchmem ./... | tee benchmark.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchmark.txt
          retention-days: 30

  image-pins:
    name: Image Pins
    # Every image reference in the repo must match the vendored dx registry
    # (Decision qualithm/pm#744, amendment 2026-10-03). Runs on every PR, docs
    # included: a README can carry an image reference too. Repos not enrolled
    # in dx images-sync.config carry no vendored registry and skip.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check image pins against the vendored dx registry
        run: |
          if [ ! -f .github/images/images.config ]; then
            echo "not enrolled in dx images-sync.config; skipping"
            exit 0
          fi
          .github/images/images check --config .github/images/images.config .

  ci-required:
    name: CI Required
    if: always()
    needs: [changes, build, lint, coverage, benchmarks, image-pins]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify dependent jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' \
            || { echo "::error::One or more required jobs failed or were cancelled"; exit 1; }
